name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: bovann_test
          MYSQL_USER: bovann
          MYSQL_PASSWORD: bovann_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      DATABASE_URL: mysql://bovann:bovann_ci@127.0.0.1:3306/bovann_test
      DATABASE_URL_TEST: mysql://bovann:bovann_ci@127.0.0.1:3306/bovann_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bovann/shared build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          pnpm --filter @bovann/api db:migrate
          pnpm --filter @bovann/api db:reset
          pnpm --filter @bovann/api db:migrate
          pnpm --filter @bovann/api db:seed

      - name: Tests (unit + integration against MySQL)
        run: pnpm test

      - name: Build
        run: pnpm build

  staging-smoke:
    name: Staging stack (Docker build, deploy, smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # pipefail: `deploy.sh | tee log` must fail when deploy.sh fails.
        shell: bash
    env:
      STAGING_PASSWORD: smoke-only-password
      CURL_INSECURE: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t local/bovann-api:smoke .

      - name: Build the website image (simulated payments, as on staging)
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_PAYMENT_SIMULATION=true \
            -t local/bovann-web:smoke .

      - name: Prepare a staging folder like the server's
        run: |
          dir="$RUNNER_TEMP/staging"
          mkdir -p "$dir"
          cp infra/staging/compose.yml infra/staging/Caddyfile infra/staging/deploy.sh infra/staging/smoke-test.sh "$dir/"
          hash="$(docker run --rm caddy:2.10 caddy hash-password --plaintext "$STAGING_PASSWORD")"
          cat > "$dir/.env" <<ENV
          STAGING_DOMAIN=localhost
          IMAGE_REPO=local
          CADDY_TLS=local_certs
          MYSQL_ROOT_PASSWORD='$(openssl rand -hex 16)'
          MYSQL_PASSWORD='$(openssl rand -hex 16)'
          OTP_SECRET='$(openssl rand -hex 32)'
          STAGING_AUTH_USER=bovann
          STAGING_AUTH_HASH='${hash}'
          ENV
          sed -i 's/^ *//' "$dir/.env"
          echo "STAGING_DIR=$dir" >> "$GITHUB_ENV"

      - name: First deploy (migrations and seed)
        working-directory: ${{ env.STAGING_DIR }}
        run: SKIP_PULL=1 ./deploy.sh smoke | tee first-deploy.log

      - name: Smoke test, with a booking paid by simulation
        working-directory: ${{ env.STAGING_DIR }}
        run: ./smoke-test.sh localhost --book

      - name: A second deploy keeps the data and does not seed again
        working-directory: ${{ env.STAGING_DIR }}
        run: |
          grep -q 'First deploy: seeding' first-deploy.log
          SKIP_PULL=1 ./deploy.sh smoke | tee second-deploy.log
          if grep -q 'First deploy: seeding' second-deploy.log; then
            echo "The seed ran again on a database that already had data" >&2; exit 1
          fi
          ./smoke-test.sh localhost

      - name: Logs on failure
        if: failure()
        working-directory: ${{ env.STAGING_DIR }}
        run: docker compose --env-file .env --env-file release.env.next logs --tail 200 || docker compose --env-file .env --env-file release.env logs --tail 200
